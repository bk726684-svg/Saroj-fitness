<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murlidhar POS (Offline)</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' },
                        brand: { DEFAULT: '#d946ef', hover: '#c026d3', accent: '#06b6d4' }
                    },
                    boxShadow: { 'neon': '0 0 10px rgba(217, 70, 239, 0.5)' }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #1e293b; } ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        .glass-card { background: linear-gradient(145deg, rgba(30,41,59,0.9) 0%, rgba(15,23,42,0.95) 100%); border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3); }
        .fade-in { animation: fadeIn 0.4s forwards; } @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 60; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal-content { background: #1e293b; padding: 25px; border-radius: 20px; width: 90%; max-width: 500px; border: 1px solid #334155; }
        @media print { body * { visibility: hidden; } #print-area, #print-area * { visibility: visible; } #print-area { position: absolute; left: 0; top: 0; width: 100%; color: black !important; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- DEFAULT DATA (Offline Database) ---
        const DEFAULT_USERS = [
            { id: 1, name: 'Owner', role: 'admin', pin: '1234', commission: 0, locked: false },
            { id: 2, name: 'Staff', role: 'staff', pin: '0000', commission: 5, locked: false }
        ];
        const DEFAULT_PRODUCTS = [
            { id: 1, name: 'Chocobar', price: 20, image: '' },
            { id: 2, name: 'Cone', price: 30, image: '' },
            { id: 3, name: 'Cup', price: 10, image: '' }
        ];

        // --- COMPONENTS ---
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 2000); return () => clearTimeout(timer); }, [onClose]);
            const bg = type === 'success' ? 'bg-emerald-500' : 'bg-rose-500';
            return <div className={`fixed top-5 right-5 ${bg} text-white px-6 py-3 rounded-xl shadow-xl z-50 fade-in`}>{message}</div>;
        };

        const useIcons = (deps=[]) => { useEffect(() => { try { lucide.createIcons(); } catch (e) {} }, deps); };

        const EditTransactionModal = ({ transaction, onSave, onClose }) => {
            const [items, setItems] = useState(JSON.parse(JSON.stringify(transaction.items)));
            const total = items.reduce((sum, item) => sum + (Number(item.price) * item.qty), 0);

            const updateQty = (idx, delta) => {
                const newItems = [...items];
                newItems[idx].qty += delta;
                if (newItems[idx].qty <= 0) {
                    if(confirm("Remove item?")) newItems.splice(idx, 1);
                    else newItems[idx].qty = 1;
                }
                setItems(newItems);
            };

            return (
                <div className="modal-overlay">
                    <div className="modal-content">
                        <div className="flex justify-between mb-4 border-b border-gray-700 pb-2"><h3 className="text-white font-bold">Edit Order #{transaction.id}</h3><button onClick={onClose} className="text-gray-400">X</button></div>
                        <div className="space-y-2 max-h-[60vh] overflow-y-auto">
                            {items.map((item, idx) => (
                                <div key={idx} className="flex justify-between items-center bg-dark-800 p-2 rounded border border-dark-700">
                                    <div><p className="text-white font-bold">{item.name}</p><p className="text-xs text-gray-400">₹{item.price}</p></div>
                                    <div className="flex gap-2">
                                        <button onClick={()=>updateQty(idx,-1)} className="text-rose-400">-</button>
                                        <span className="text-white w-6 text-center">{item.qty}</span>
                                        <button onClick={()=>updateQty(idx,1)} className="text-emerald-400">+</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <div className="mt-4 pt-4 border-t border-gray-700 flex justify-between">
                            <span className="text-xl font-bold text-brand">₹{total}</span>
                            <button onClick={()=>onSave(transaction.id, items, total)} className="bg-brand text-white px-4 py-1 rounded">Save</button>
                        </div>
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            // Load from LocalStorage
            const [users, setUsers] = useState(() => JSON.parse(localStorage.getItem('pos_users')) || DEFAULT_USERS);
            const [products, setProducts] = useState(() => JSON.parse(localStorage.getItem('pos_products')) || DEFAULT_PRODUCTS);
            const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('pos_transactions')) || []);
            const [expenses, setExpenses] = useState(() => JSON.parse(localStorage.getItem('pos_expenses')) || []);
            const [returns, setReturns] = useState(() => JSON.parse(localStorage.getItem('pos_returns')) || []);
            
            // Session Persistence
            const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('pos_active_session')));
            const [toast, setToast] = useState(null);

            // Auto-Save Effects
            useEffect(() => localStorage.setItem('pos_users', JSON.stringify(users)), [users]);
            useEffect(() => localStorage.setItem('pos_products', JSON.stringify(products)), [products]);
            useEffect(() => localStorage.setItem('pos_transactions', JSON.stringify(transactions)), [transactions]);
            useEffect(() => localStorage.setItem('pos_expenses', JSON.stringify(expenses)), [expenses]);
            useEffect(() => localStorage.setItem('pos_returns', JSON.stringify(returns)), [returns]);
            useEffect(() => {
                if(user) localStorage.setItem('pos_active_session', JSON.stringify(user));
                else localStorage.removeItem('pos_active_session');
            }, [user]);

            useIcons([user]);

            const actions = {
                login: (name, pin) => {
                    const u = users.find(u => u.name === name && u.pin === pin);
                    if (u) { if(u.locked) setToast({message:'Locked!',type:'error'}); else setUser(u); }
                    else setToast({message:'Invalid!',type:'error'});
                },
                logout: () => setUser(null),
                
                checkout: (items, total) => {
                    setTransactions([{ id: Date.now(), date: new Date().toLocaleString(), employeeName: user.name, items, total }, ...transactions]);
                    setToast({message:'Saved!', type:'success'});
                },
                updateTransaction: (id, items, total) => {
                    setTransactions(transactions.map(t => t.id === id ? { ...t, items, total } : t));
                    setToast({message:'Updated!', type:'success'});
                },
                
                // CRUD
                addProduct: (p) => setProducts([...products, { ...p, id: Date.now(), price: Number(p.price) }]),
                deleteProduct: (id) => setProducts(products.filter(p => p.id !== id)),
                
                addUser: (u) => setUsers([...users, { ...u, id: Date.now(), locked: false }]),
                deleteUser: (id) => setUsers(users.filter(u => u.id !== id)),
                toggleLock: (id) => setUsers(users.map(u => u.id === id ? { ...u, locked: !u.locked } : u)),
                updatePin: (id) => { const p=prompt("New PIN"); if(p) setUsers(users.map(u => u.id===id ? {...u, pin:p} : u)); },
                updateCommission: (id) => { const c=prompt("Comm %"); if(c) setUsers(users.map(u => u.id===id ? {...u, commission:Number(c)} : u)); },

                addExpense: (e) => setExpenses([{ ...e, id: Date.now(), date: new Date().toLocaleDateString() }, ...expenses]),
                deleteExpense: (id) => setExpenses(expenses.filter(e => e.id !== id)),
                editExpense: (id, d, a) => setExpenses(expenses.map(e => e.id===id ? {...e, desc:d, amount:a} : e)),

                addReturn: (r) => {
                    const newRet = { ...r, id: Date.now(), date: new Date().toLocaleDateString() };
                    setReturns([newRet, ...returns]);
                    // Auto Expense
                    let val = Number(r.amount);
                    let share = r.costBearer === '100_owner' ? val : r.costBearer === '50_50' ? val/2 : 0;
                    if(share > 0) setExpenses([{ id: Date.now()+1, date: new Date().toLocaleDateString(), desc: `Return Share (${r.costBearer})`, amount: share, isReturnLoss: true, linkedReturnId: newRet.id }, ...expenses]);
                    setToast({message:'Return Logged', type:'success'});
                },
                deleteReturn: (id) => {
                    setReturns(returns.filter(r => r.id !== id));
                    setExpenses(expenses.filter(e => e.linkedReturnId !== id));
                    setToast({message:'Deleted', type:'success'});
                }
            };

            if(!user) return (
                <div className="min-h-screen flex items-center justify-center bg-dark-900">
                    <div className="glass-card p-8 rounded-2xl w-full max-w-sm">
                        <h1 className="text-3xl font-bold text-white text-center mb-6">Murlidhar POS</h1>
                        <form onSubmit={e=>{e.preventDefault(); actions.login(e.target.u.value, e.target.p.value)}} className="space-y-4">
                            <select name="u" className="w-full p-3 bg-dark-800 border border-dark-700 text-white rounded"><option value="">Select User</option>{users.map(u=><option key={u.id} value={u.name} disabled={u.locked}>{u.name}</option>)}</select>
                            <input name="p" type="password" placeholder="PIN" className="w-full p-3 bg-dark-800 border border-dark-700 text-white rounded text-center" maxLength="4"/>
                            <button className="w-full bg-brand text-white py-3 rounded font-bold">Login</button>
                        </form>
                        {toast && <p className="text-rose-500 text-center mt-2">{toast.message}</p>}
                    </div>
                </div>
            );

            return (
                <>
                    {toast && <Toast message={toast.message} type={toast.type} onClose={()=>setToast(null)} />}
                    {user.role === 'admin' ? 
                        <AdminDashboard user={user} users={users} products={products} transactions={transactions} expenses={expenses} returns={returns} actions={actions} /> : 
                        <POS user={user} products={products} transactions={transactions} onLogout={actions.logout} onCheckout={actions.checkout} onUpdateTransaction={actions.updateTransaction} />
                    }
                </>
            );
        };

        // --- SUB COMPONENTS ---

        const POS = ({ user, products, onLogout, onCheckout, transactions, onUpdateTransaction }) => {
            useIcons();
            const [cart, setCart] = useState([]);
            const [search, setSearch] = useState('');
            const [view, setView] = useState('pos');
            const [editingTx, setEditingTx] = useState(null);
            
            // Corrected updateQty Logic
            const updateQty = (id, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQty = item.qty + delta;
                        return newQty > 0 ? { ...item, qty: newQty } : null;
                    }
                    return item;
                }).filter(Boolean));
            };

            const addToCart = (p) => setCart(prev => { const ex = prev.find(i=>i.id===p.id); return ex ? prev.map(i=>i.id===p.id ? {...i, qty:i.qty+1} : i) : [...prev, {...p, qty:1}]; });
            const total = cart.reduce((s,i) => s+(i.price*i.qty), 0);
            const filtered = products.filter(p => p.name.toLowerCase().includes(search.toLowerCase()));

            return (
                <div className="h-screen flex flex-col md:flex-row bg-dark-900 text-white">
                    {editingTx && <EditTransactionModal transaction={editingTx} onClose={()=>setEditingTx(null)} onSave={(id, items, t) => { onUpdateTransaction(id, items, t); setEditingTx(null); }} />}
                    
                    <div className="flex-1 flex flex-col h-full">
                        <div className="glass-card p-4 flex justify-between items-center z-10">
                            <div><h2 className="font-bold text-xl">POS</h2><span className="text-brand">{user.name}</span></div>
                            <div className="flex gap-2"><button onClick={onLogout} className="text-rose-500"><i data-lucide="log-out"></i></button></div>
                        </div>
                        <div className="p-4 flex-1 overflow-y-auto">
                            <input placeholder="
