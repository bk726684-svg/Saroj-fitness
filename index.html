<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murlidhar Icecream POS (Live)</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ice: {
                            50: '#fdf2f8', 100: '#fce7f3', 200: '#fbcfe8', 300: '#f9a8d4',
                            400: '#f472b6', 500: '#ec4899', 600: '#db2777', 700: '#be185d', 800: '#9d174d', 900: '#831843',
                        },
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ec4899; border-radius: 4px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none;  scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; background: white; padding: 20px; color: black !important; }
            #print-area h1, #print-area h3, #print-area th, #print-area td { color: black !important; }
        }
        
        #error-display {
            position: fixed; top: 0; left: 0; width: 100%; background: red; color: white;
            padding: 20px; z-index: 9999; display: none; font-family: monospace; font-size: 14px;
            white-space: pre-wrap; word-break: break-word;
        }
        #loading-screen {
            position: fixed; inset: 0; background: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>
    <div id="error-display"></div>
    <div id="root"></div>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const errBox = document.getElementById('error-display');
            errBox.style.display = 'block';
            errBox.innerHTML = `APP ERROR: ${message} \nSource: ${source} \nLine: ${lineno}`;
        };
    </script>

    <script type="text/babel">
        // --- FIREBASE CONFIGURATION (YOURS) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBruhBISgdlhXaNBFl_QmAhGttBnojFTKI",
            authDomain: "murlidhar-icecream.firebaseapp.com",
            databaseURL: "https://murlidhar-icecream-default-rtdb.firebaseio.com",
            projectId: "murlidhar-icecream",
            storageBucket: "murlidhar-icecream.firebasestorage.app",
            messagingSenderId: "464057103933",
            appId: "1:464057103933:web:25192a8b47ce9238149c54"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        // We use Firestore for Documents, not Realtime Database (better for queries)
        const db = firebase.firestore();

        const { useState, useEffect, useRef } = React;

        // --- DEFAULTS FOR SEEDING ---
        const DEFAULT_USERS_SEED = [
            { id: 1, name: 'Owner', role: 'admin', pin: '1234', commission: 0, locked: false },
        ];
        const DEFAULT_PRODUCTS_SEED = [
            { id: 1, name: 'Chocobar', price: 10, category: 'Icecream', image: '' },
            { id: 2, name: 'Cup', price: 10, category: 'Icecream', image: '' },
            { id: 3, name: 'Cone - Regular', price: 10, category: 'Cone', image: '' },
            { id: 4, name: 'Cone - Special', price: 20, category: 'Cone', image: '' },
        ];

        // --- Helper Components ---
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 3000); return () => clearTimeout(timer); }, [onClose]);
            const bg = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            return <div className={`fixed top-5 right-5 ${bg} text-white px-6 py-3 rounded-lg shadow-xl z-50 flex items-center gap-2 fade-in`}><i data-lucide={type === 'success' ? 'check-circle' : 'alert-circle'}></i><span>{message}</span></div>;
        };
        
        const useIcons = () => {
            useEffect(() => { 
                try { lucide.createIcons(); } 
                catch (e) { console.error("Icon Error:", e); }
            }, []);
        };

        // 1. LOGIN COMPONENT
        const Login = ({ onLogin, users }) => {
            useIcons();
            const [selectedUser, setSelectedUser] = useState('');
            const [pin, setPin] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');
                if (!selectedUser) return setError('Please select a user.');
                if (pin.length !== 4) return setError('PIN must be 4 digits.');
                
                const user = users.find(u => u.name === selectedUser && u.pin === pin);
                
                if(user) {
                    if (user.locked) {
                        return setError('Account Locked. Contact Admin.');
                    }
                    onLogin(user); 
                } else { 
                    setError('Invalid PIN'); 
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-ice-100 to-purple-100 p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md fade-in border border-ice-200">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-ice-600 mb-2">Murlidhar Icecream</h1>
                            <p className="text-gray-500">Secure POS Login (Online)</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Select User</label>
                                <select className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-ice-500 outline-none" value={selectedUser} onChange={(e) => setSelectedUser(e.target.value)}>
                                    <option value="">-- Choose --</option>
                                    {users.map(u => <option key={u.id} value={u.name} disabled={u.locked}>{u.name} ({u.role}) {u.locked ? '🔒' : ''}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Enter PIN</label>
                                <input type="password" maxLength="4" className="w-full p-3 text-center text-2xl tracking-widest border border-gray-300 rounded-lg focus:ring-2 focus:ring-ice-500 outline-none" value={pin} onChange={(e) => setPin(e.target.value.replace(/\D/g, ''))} placeholder="••••" />
                            </div>
                            {error && <p className="text-red-500 text-sm text-center bg-red-50 p-2 rounded">{error}</p>}
                            <button type="submit" className="w-full bg-ice-600 hover:bg-ice-700 text-white font-bold py-3 rounded-lg transition shadow-lg flex justify-center items-center gap-2">
                                <i data-lucide="log-in"></i> Login
                            </button>
                        </form>
                        <p className="text-xs text-center text-gray-400 mt-4">Connected to Firebase Cloud</p>
                    </div>
                </div>
            );
        };

        // 2. POS COMPONENT
        const POS = ({ user, users, products, onLogout, onCheckout, transactions }) => {
            useIcons();
            const [cart, setCart] = useState([]); 
            const [search, setSearch] = useState('');
            const [showHistory, setShowHistory] = useState(false); 
            const [expandedId, setExpandedId] = useState(null);
            
            // Real-time Freeze check
            const liveUserStatus = users.find(u => u.id === user.id);
            if (liveUserStatus && liveUserStatus.locked) {
                return (
                    <div className="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center text-center p-4">
                        <div className="text-red-500 mb-4 animate-pulse">
                            <i data-lucide="lock" className="w-24 h-24 mx-auto mb-4"></i>
                        </div>
                        <h1 className="text-4xl font-bold text-gray-800 mb-2">Account Locked</h1>
                        <p className="text-gray-500 mb-6">Access suspended by Admin remotely.</p>
                        <button onClick={() => window.location.reload()} className="mt-8 px-6 py-2 bg-gray-200 hover:bg-gray-300 rounded-full text-gray-700 font-semibold transition">Refresh</button>
                    </div>
                );
            }
            
            const addToCart = (product) => { 
                setCart(prev => { 
                    const existing = prev.find(item => item.id === product.id); 
                    if (existing) return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item); 
                    return [...prev, { ...product, qty: 1 }]; 
                }); 
            };
            
            const updateQty = (id, delta) => { 
                setCart(prev => prev.map(item => { 
                    if (item.id === id) { const newQty = item.qty + delta; return newQty > 0 ? { ...item, qty: newQty } : null; } 
                    return item; 
                }).filter(Boolean)); 
            };

            const updateQtyManual = (id, value) => { 
                const newQty = parseInt(value); 
                if(newQty > 0) { setCart(prev => prev.map(item => item.id === id ? { ...item, qty: newQty } : item)); }
            };

            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const filteredProducts = products.filter(p => p.name.toLowerCase().includes(search.toLowerCase()));
            
            const handlePrint = () => { window.print(); };
            
            const safeTransactions = Array.isArray(transactions) ? transactions : [];
            const userHistory = safeTransactions.filter(t => t.employeeName === user.name).sort((a,b) => b.id - a.id);
            const groupedHistory = userHistory.reduce((acc, tx) => { 
                try {
                    const day = tx.date.split(',')[0]; 
                    if(!acc[day]) acc[day] = []; 
                    acc[day].push(tx); 
                    return acc;
                } catch(e) { return acc; }
            }, {});

            return (
                <div className="h-screen flex flex-col md:flex-row overflow-hidden relative">
                    {showHistory && (
                        <div className="absolute inset-0 z-50 bg-black/50 flex items-center justify-center p-4 fade-in">
                            <div className="bg-white w-full max-w-2xl h-[80vh] rounded-xl shadow-2xl flex flex-col overflow-hidden">
                                <div className="p-4 border-b flex justify-between items-center bg-ice-50">
                                    <h2 className="text-xl font-bold text-ice-800">My Sales History</h2>
                                    <button onClick={() => setShowHistory(false)} className="p-2 bg-white rounded-full shadow hover:bg-gray-100 text-gray-600"><i data-lucide="x"></i></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4">
                                    {Object.keys(groupedHistory).length === 0 && <p className="text-center text-gray-500 mt-10">No sales history found.</p>}
                                    {Object.keys(groupedHistory).sort().reverse().map(date => (
                                        <div key={date} className="mb-6">
                                            <h3 className="text-sm font-bold text-gray-500 bg-gray-100 inline-block px-3 py-1 rounded-full mb-2">{date}</h3>
                                            <div className="space-y-2">
                                                {groupedHistory[date].map(tx => (
                                                    <div key={tx.id} className="bg-white border rounded-lg p-3 shadow-sm">
                                                        <div className="flex justify-between items-center mb-2 cursor-pointer" onClick={() => setExpandedId(expandedId === tx.id ? null : tx.id)}>
                                                            <span className="font-bold text-gray-700">₹{tx.total}</span>
                                                            <span className="text-sm font-mono text-ice-600 bg-ice-50 px-2 py-1 rounded">{tx.date.split(',')[1].trim()}</span>
                                                        </div>
                                                        {expandedId === tx.id && (
                                                            <ul className="text-sm text-gray-600 border-t pt-2 space-y-1">
                                                                {Array.isArray(tx.items) ? tx.items.map((item,i) => <li key={i}>{item.qty} x {item.name}</li>) : <li>Items data missing</li>}
                                                            </ul>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="flex-1 flex flex-col h-full bg-gray-50">
                        <header className="bg-white shadow-sm p-4 flex justify-between items-center z-10">
                            <div>
                                <h2 className="text-xl font-bold text-gray-800">POS Terminal</h2>
                                <p className="text-sm text-gray-500">Operator: <span className="text-ice-600 font-semibold">{user.name}</span></p>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setShowHistory(true)} className="p-2 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded transition"><i data-lucide="history"></i></button>
                                <button onClick={onLogout} className="p-2 text-gray-500 hover:text-red-500 transition"><i data-lucide="log-out"></i></button>
                            </div>
                        </header>
                        <div className="p-4 flex-1 overflow-y-auto">
                            <div className="mb-4 relative">
                                <i data-lucide="search" className="absolute left-3 top-3 text-gray-400"></i>
                                <input type="text" placeholder="Search items..." className="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg outline-none focus:border-ice-500" value={search} onChange={(e) => setSearch(e.target.value)} />
                            </div>
                            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                                {filteredProducts.map(p => (
                                    <button key={p.id} onClick={() => addToCart(p)} className="bg-white p-4 rounded-xl shadow-sm hover:shadow-md border border-transparent hover:border-ice-200 transition flex flex-col items-center justify-center gap-2 group">
                                        {p.image ? (
                                            <img src={p.image} alt={p.name} className="w-16 h-16 object-cover rounded-full mb-2" onError={(e) => e.target.style.display='none'} />
                                        ) : (
                                            <div className={`w-16 h-16 rounded-full flex items-center justify-center text-3xl mb-2 ${p.category === 'Icecream' ? 'bg-pink-100' : p.category === 'Cone' ? 'bg-yellow-100' : 'bg-purple-100'}`}>🍦</div>
                                        )}
                                        <div className="text-center">
                                            <h3 className="font-semibold text-gray-700 text-sm truncate w-full">{p.name}</h3>
                                            <p className="text-ice-600 font-bold">₹{p.price}</p>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                    
                    <div className="w-full md:w-96 bg-white shadow-xl flex flex-col h-[40vh] md:h-full z-20">
                        <div className="p-4 border-b bg-gray-50 flex justify-between items-center">
                            <h3 className="font-bold text-gray-700">Current Order</h3>
                            <span className="bg-ice-100 text-ice-700 text-xs px-2 py-1 rounded-full">{cart.length} items</span>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {cart.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center text-gray-400">
                                    <i data-lucide="shopping-cart" className="mb-2 opacity-50"></i>
                                    <p>Cart is empty</p>
                                </div>
                            ) : (
                                cart.map(item => (
                                    <div key={item.id} className="flex justify-between items-center bg-white border rounded-lg p-3 shadow-sm">
                                        <div className="flex-1">
                                            <p className="font-medium text-gray-800 text-sm">{item.name}</p>
                                            <p className="text-xs text-gray-500">₹{item.price} x {item.qty}</p>
                                        </div>
                                        <div className="flex items-center gap-2 bg-gray-50 rounded-lg p-1">
                                            <button onClick={() => updateQty(item.id, -1)} className="w-6 h-6 rounded bg-white hover:bg-gray-200 flex items-center justify-center text-gray-600 font-bold">-</button>
                                            <input 
                                                type="number" 
                                                value={item.qty} 
                                                onChange={(e) => updateQtyManual(item.id, e.target.value)} 
                                                className="w-10 text-center text-sm bg-transparent outline-none font-bold text-gray-700" 
                                                min="1"
                                            />
                                            <button onClick={() => updateQty(item.id, 1)} className="w-6 h-6 rounded bg-white hover:bg-gray-200 flex items-center justify-center text-gray-600 font-bold">+</button>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                        <div className="p-4 bg-gray-50 border-t space-y-3">
                            <div className="flex justify-between items-center">
                                <span className="text-gray-600 font-medium">Total Amount</span>
                                <span className="text-2xl font-bold text-gray-800">₹{totalAmount}</span>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <button onClick={handlePrint} disabled={cart.length === 0} className="w-full bg-white border border-gray-300 text-gray-700 hover:bg-gray-100 font-bold py-3 rounded-lg shadow transition flex justify-center items-center gap-2">
                                    <i data-lucide="printer"></i> Print
                                </button>
                                <button onClick={() => onCheckout(cart, totalAmount)} disabled={cart.length === 0} className="w-full bg-ice-600 hover:bg-ice-700 disabled:bg-gray-300 text-white font-bold py-3 rounded-lg shadow transition flex justify-center items-center gap-2">
                                    <i data-lucide="save"></i> Save
                                </button>
                            </div>
                        </div>
                    </div>

                    <div id="print-area" className="hidden">
                        <div style={{textAlign: 'center', marginBottom: '20px'}}><h1 style={{fontSize: '24px', fontWeight: 'bold', margin: 0}}>MURLIDHAR ICECREAM</h1><p style={{color: '#666', fontSize: '12px'}}>Delicious & Fresh</p></div>
                        <div style={{borderBottom: '1px dashed #ccc', marginBottom: '10px', paddingBottom: '10px'}}><p><strong>Date:</strong> {new Date().toLocaleDateString()}</p><p><strong>Operator:</strong> {user.name}</p></div>
                        <table style={{width: '100%', borderCollapse: 'collapse', marginBottom: '20px', fontSize: '14px'}}><thead><tr style={{borderBottom: '2px solid #000'}}><th style={{textAlign: 'left'}}>Item</th><th style={{textAlign: 'center'}}>Qty</th><th style={{textAlign: 'right'}}>Price</th><th style={{textAlign: 'right'}}>Total</th></tr></thead><tbody>{cart.map((item, idx) => (<tr key={idx}><td style={{padding: '5px 0'}}>{item.name}</td><td style={{textAlign: 'center'}}>{item.qty}</td><td style={{textAlign: 'right'}}>₹{item.price}</td><td style={{textAlign: 'right'}}>₹{item.price * item.qty}</td></tr>))}</tbody></table>
                        <div style={{textAlign: 'right', fontSize: '18px', fontWeight: 'bold', borderTop: '2px solid #000', paddingTop: '10px'}}>TOTAL: ₹{totalAmount}</div>
                        <div style={{textAlign: 'center', marginTop: '30px', fontSize: '12px'}}><p>Thank you for your visit!</p><p>Visit us again.</p></div>
                    </div>
                </div>
            );
        };

        // 3. OVERVIEW TAB
        const OverviewTab = ({ transactions, users, returns, products, expenses }) => {
            useIcons();
            const chart1 = useRef(null); 
            const colorPalette = ['#ec4899', '#3b82f6', '#10b981', '#f5
