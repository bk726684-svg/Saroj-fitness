<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Murlidhar POS (Offline)</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        dark: { 900: '#000000', 800: '#121212', 700: '#1e1e1e' },
                        brand: { DEFAULT: '#d946ef', hover: '#c026d3', accent: '#06b6d4' }
                    },
                    boxShadow: { 'neon': '0 0 15px rgba(217, 70, 239, 0.4)', 'top': '0 -4px 20px rgba(0,0,0,0.5)' }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        html, body { height: 100%; width: 100%; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; border: 2px solid #121212; }
        /* Glass Effect */
        .glass { background: rgba(18, 18, 18, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .glass-card { background: #121212; border: 1px solid rgba(255,255,255,0.05); }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #d946ef; }
        /* Print Styles */
        @media print { 
            body * { visibility: hidden; } 
            #print-area, #print-area * { visibility: visible; } 
            #print-area { position: absolute; left: 0; top: 0; width: 100%; background: white; padding: 20px; color: black !important; } 
        }
        /* Loading Animation */
        .loader { width: 48px; height: 48px; border: 5px solid #333; border-bottom-color: #d946ef; border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        //  DATABASE ENGINE (BROWSER LOCAL STORAGE)
        // ==========================================
        const DB_KEY = 'murlidhar_pos_db_vFINAL';
        
        const LocalDB = {
            init: () => {
                // Agar database nahi hai, to naya banao
                if (!localStorage.getItem(DB_KEY)) {
                    const seed = {
                        users: [{id: 1, name: 'Admin', pin: '1234', role: 'admin', commission: 0, locked: 0}],
                        products: [
                            {id: 1, name: 'Vanilla Scoop', price: 50, image: ''},
                            {id: 2, name: 'Chocolate Cone', price: 80, image: ''}
                        ],
                        transactions: [],
                        expenses: [],
                        returns: []
                    };
                    localStorage.setItem(DB_KEY, JSON.stringify(seed));
                }
            },
            get: () => JSON.parse(localStorage.getItem(DB_KEY)),
            save: (data) => localStorage.setItem(DB_KEY, JSON.stringify(data)),
            // Simulate Server Actions
            execute: async (action, payload) => {
                await new Promise(r => setTimeout(r, 50)); // Tiny delay for realism
                const db = LocalDB.get();
                
                // Helper: Date Formatting
                const formatDateTime = (d) => {
                    const pad = n => n<10?'0'+n:n;
                    return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
                };

                switch(action) {
                    case 'get_all':
                        return { 
                            users: db.users, 
                            products: db.products, 
                            transactions: db.transactions.sort((a,b)=>b.id-a.id), 
                            expenses: db.expenses.sort((a,b)=>b.id-a.id), 
                            returns: db.returns.sort((a,b)=>b.id-a.id) 
                        };
                    
                    case 'login':
                        const user = db.users.find(u => u.name === payload.name && u.pin === payload.pin);
                        if(user) {
                             if(Number(user.locked) === 1) return { status: 'error', message: 'Account Locked' };
                             return { status: 'success', user };
                        }
                        return { status: 'error', message: 'Invalid PIN' };

                    case 'add_product':
                        db.products.push({ id: Date.now(), ...payload });
                        LocalDB.save(db);
                        return { status: 'success' };

                    case 'delete_product':
                        db.products = db.products.filter(p => p.id !== payload.id);
                        LocalDB.save(db);
                        return { status: 'success' };

                    case 'add_user':
                        db.users.push({ id: Date.now(), ...payload, locked: 0 });
                        LocalDB.save(db);
                        return { status: 'success' };

                    case 'delete_user':
                        db.users = db.users.filter(u => u.id !== payload.id);
                        LocalDB.save(db);
                        return { status: 'success' };

                    case 'toggle_lock':
                        db.users = db.users.map(u => u.id === payload.id ? {...u, locked: u.locked ? 0 : 1} : u);
                        LocalDB.save(db);
                        return { status: 'success' };

                    case 'save_transaction':
                        const newTx = {
                            id: Date.now(),
                            date: formatDateTime(new Date()),
                            employeeName: payload.employeeName,
                            items: payload.items,
                            total: payload.total
                        };
                        db.transactions.push(newTx);
                        LocalDB.save(db);
                        return { status: 'success' };

                    case 'update_transaction':
                        db.transactions = db.transactions.map(t => t.id === payload.id ? {...t, items: payload.items, total: payload.total} : t);
                        LocalDB.save(db);
                        return { status: 'success' };

                    case 'add_return':
                        db.returns.push({ id: Date.now(), ...payload });
                        LocalDB.save(db);
                        return { status: 'success' };

                    case 'delete_return':
                        db.returns = db.returns.filter(r => r.id !== payload.id);
                        LocalDB.save(db);
                        return { status: 'success' };
                    
                    case 'add_expense':
                        db.expenses.push({ id: Date.now(), date: formatDateTime(new Date()), description: payload.desc, amount: payload.amount });
                        LocalDB.save(db);
                        return { status: 'success' };
                        
                    case 'delete_expense':
                        db.expenses = db.expenses.filter(e => e.id !== payload.id);
                        LocalDB.save(db);
                        return { status: 'success' };

                    case 'update_pin':
                        db.users = db.users.map(u => u.id === payload.id ? {...u, pin: payload.pin} : u);
                        LocalDB.save(db);
                        return { status: 'success' };

                    case 'update_commission':
                        db.users = db.users.map(u => u.id === payload.id ? {...u, commission: payload.commission} : u);
                        LocalDB.save(db);
                        return { status: 'success' };

                    default: return { status: 'error', message: 'Unknown Action' };
                }
            }
        };

        // Load DB Logic
        LocalDB.init();

        // ==========================================
        //  UI ICONS
        // ==========================================
        const Icons = {
            'check-circle': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
            'x': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
            'log-in': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>,
            'calendar': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
            'trending-up': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>,
            'search': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>,
            'shopping-bag': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>,
            'printer': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>,
            'check': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
            'layout-dashboard': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>,
            'history': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            'log-out': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
            'edit-2': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>,
            'trash-2': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>,
            'lock': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
            'unlock': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>,
            'key': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>,
            'rotate-ccw': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>,
            'banknote': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="12" y1="12" x2="12" y2="12.01"/><path d="M17 12h.01"/><path d="M7 12h.01"/></svg>,
            'users': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            'utensils': <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
        };
        const Icon = ({ name, className }) => ( <span className={`inline-flex items-center justify-center ${className || ''}`}>{Icons[name] || <span>{name}</span>}</span> );
        
        // 5 AM CUTOFF HELPER
        const getTodayDate = () => {
            const now = new Date();
            if (now.getHours() < 5) now.setDate(now.getDate() - 1);
            return now.toISOString().split('T')[0];
        };

        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 3000); return () => clearTimeout(timer); }, [onClose]);
            const bg = type === 'success' ? 'bg-emerald-500' : 'bg-rose-500';
            return <div className={`fixed top-10 left-1/2 -translate-x-1/2 z-[100] ${bg} text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3 fade-in border border-white/20`}><Icon name={type === 'success' ? 'check-circle' : 'alert-circle'} /><span className="font-medium text-sm">{message}</span></div>;
        };

        const EditTransactionModal = ({ transaction, onSave, onClose }) => {
            const [items, setItems] = useState(JSON.parse(JSON.stringify(transaction.items)));
            const total = items.reduce((sum, item) => sum + (Number(item.price) * item.qty), 0);
            const updateQty = (idx, delta) => {
                const newItems = [...items];
                newItems[idx].qty += delta;
                if (newItems[idx].qty <= 0) { if(confirm("Remove this item?")) newItems.splice(idx, 1); else newItems[idx].qty = 1; }
                setItems(newItems);
            };
            const handleSave = () => { if(items.length === 0) return alert("Order cannot be empty!"); onSave(transaction.id, items, total); };
            return (
                <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex flex-col items-center justify-end p-4 fade-in" onClick={onClose}>
                    <div className="glass-card w-full max-w-lg rounded-t-3xl p-6 md:p-8 shadow-2xl relative animate-in slide-in-from-bottom-10" onClick={e => e.stopPropagation()}>
                        <div className="flex justify-between items-center mb-6 pb-4 border-b border-gray-700"><h3 className="text-xl font-bold text-white">Edit Order #{transaction.id}</h3><button onClick={onClose} className="text-gray-400 hover:text-white transition p-1"><Icon name="x" /></button></div>
                        <div className="space-y-3 max-h-[50vh] overflow-y-auto pr-2">{items.map((item, idx) => (<div key={idx} className="flex justify-between items-center bg-dark-900/50 p-4 rounded-2xl border border-gray-700"><div><p className="font-bold text-white">{item.name}</p><p className="text-sm text-gray-400">₹{item.price}</p></div><div className="flex items-center gap-3"><button onClick={() => updateQty(idx, -1)} className="w-8 h-8 bg-
