<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murlidhar Icecream POS (Live)</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ice: {
                            50: '#fdf2f8', 100: '#fce7f3', 200: '#fbcfe8', 300: '#f9a8d4',
                            400: '#f472b6', 500: '#ec4899', 600: '#db2777', 700: '#be185d', 800: '#9d174d', 900: '#831843',
                        },
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f3f4f6; margin: 0; padding: 0; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ec4899; border-radius: 4px; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none;  scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; background: white; padding: 20px; color: black !important; }
            #print-area h1, #print-area h3, #print-area th, #print-area td { color: black !important; }
        }
        
        #error-display {
            position: fixed; top: 0; left: 0; width: 100%; background: red; color: white;
            padding: 20px; z-index: 9999; display: none; font-family: monospace; font-size: 14px;
            white-space: pre-wrap; word-break: break-word;
        }
        #loading-screen {
            position: fixed; inset: 0; background: white; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>
    <div id="error-display"></div>
    <div id="root"></div>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            const errBox = document.getElementById('error-display');
            errBox.style.display = 'block';
            errBox.innerHTML = `APP ERROR: ${message} \nSource: ${source} \nLine: ${lineno}`;
        };
    </script>

    <script type="text/babel">
        // --- FIREBASE CONFIGURATION (YOURS) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBruhBISgdlhXaNBFl_QmAhGttBnojFTKI",
            authDomain: "murlidhar-icecream.firebaseapp.com",
            databaseURL: "https://murlidhar-icecream-default-rtdb.firebaseio.com",
            projectId: "murlidhar-icecream",
            storageBucket: "murlidhar-icecream.firebasestorage.app",
            messagingSenderId: "464057103933",
            appId: "1:464057103933:web:25192a8b47ce9238149c54"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        // We use Firestore for Documents, not Realtime Database (better for queries)
        const db = firebase.firestore();

        const { useState, useEffect, useRef } = React;

        // --- DEFAULTS FOR SEEDING ---
        const DEFAULT_USERS_SEED = [
            { id: 1, name: 'Owner', role: 'admin', pin: '1234', commission: 0, locked: false },
        ];
        const DEFAULT_PRODUCTS_SEED = [
            { id: 1, name: 'Chocobar', price: 10, category: 'Icecream', image: '' },
            { id: 2, name: 'Cup', price: 10, category: 'Icecream', image: '' },
            { id: 3, name: 'Cone - Regular', price: 10, category: 'Cone', image: '' },
            { id: 4, name: 'Cone - Special', price: 20, category: 'Cone', image: '' },
        ];

        // --- Helper Components ---
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => { const timer = setTimeout(onClose, 3000); return () => clearTimeout(timer); }, [onClose]);
            const bg = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            return <div className={`fixed top-5 right-5 ${bg} text-white px-6 py-3 rounded-lg shadow-xl z-50 flex items-center gap-2 fade-in`}><i data-lucide={type === 'success' ? 'check-circle' : 'alert-circle'}></i><span>{message}</span></div>;
        };
        
        const useIcons = () => {
            useEffect(() => { 
                try { lucide.createIcons(); } 
                catch (e) { console.error("Icon Error:", e); }
            }, []);
        };

        // 1. LOGIN COMPONENT
        const Login = ({ onLogin, users }) => {
            useIcons();
            const [selectedUser, setSelectedUser] = useState('');
            const [pin, setPin] = useState('');
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                setError('');
                if (!selectedUser) return setError('Please select a user.');
                if (pin.length !== 4) return setError('PIN must be 4 digits.');
                
                const user = users.find(u => u.name === selectedUser && u.pin === pin);
                
                if(user) {
                    if (user.locked) {
                        return setError('Account Locked. Contact Admin.');
                    }
                    onLogin(user); 
                } else { 
                    setError('Invalid PIN'); 
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-ice-100 to-purple-100 p-4">
                    <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md fade-in border border-ice-200">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-ice-600 mb-2">Murlidhar Icecream</h1>
                            <p className="text-gray-500">Secure POS Login (Online)</p>
                        </div>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Select User</label>
                                <select className="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-ice-500 outline-none" value={selectedUser} onChange={(e) => setSelectedUser(e.target.value)}>
                                    <option value="">-- Choose --</option>
                                    {users.map(u => <option key={u.id} value={u.name} disabled={u.locked}>{u.name} ({u.role}) {u.locked ? '🔒' : ''}</option>)}
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">Enter PIN</label>
                                <input type="password" maxLength="4" className="w-full p-3 text-center text-2xl tracking-widest border border-gray-300 rounded-lg focus:ring-2 focus:ring-ice-500 outline-none" value={pin} onChange={(e) => setPin(e.target.value.replace(/\D/g, ''))} placeholder="••••" />
                            </div>
                            {error && <p className="text-red-500 text-sm text-center bg-red-50 p-2 rounded">{error}</p>}
                            <button type="submit" className="w-full bg-ice-600 hover:bg-ice-700 text-white font-bold py-3 rounded-lg transition shadow-lg flex justify-center items-center gap-2">
                                <i data-lucide="log-in"></i> Login
                            </button>
                        </form>
                        <p className="text-xs text-center text-gray-400 mt-4">Connected to Firebase Cloud</p>
                    </div>
                </div>
            );
        };

        // 2. POS COMPONENT
        const POS = ({ user, users, products, onLogout, onCheckout, transactions }) => {
            useIcons();
            const [cart, setCart] = useState([]); 
            const [search, setSearch] = useState('');
            const [showHistory, setShowHistory] = useState(false); 
            const [expandedId, setExpandedId] = useState(null);
            
            // Real-time Freeze check
            const liveUserStatus = users.find(u => u.id === user.id);
            if (liveUserStatus && liveUserStatus.locked) {
                return (
                    <div className="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center text-center p-4">
                        <div className="text-red-500 mb-4 animate-pulse">
                            <i data-lucide="lock" className="w-24 h-24 mx-auto mb-4"></i>
                        </div>
                        <h1 className="text-4xl font-bold text-gray-800 mb-2">Account Locked</h1>
                        <p className="text-gray-500 mb-6">Access suspended by Admin remotely.</p>
                        <button onClick={() => window.location.reload()} className="mt-8 px-6 py-2 bg-gray-200 hover:bg-gray-300 rounded-full text-gray-700 font-semibold transition">Refresh</button>
                    </div>
                );
            }
            
            const addToCart = (product) => { 
                setCart(prev => { 
                    const existing = prev.find(item => item.id === product.id); 
                    if (existing) return prev.map(item => item.id === product.id ? { ...item, qty: item.qty + 1 } : item); 
                    return [...prev, { ...product, qty: 1 }]; 
                }); 
            };
            
            const updateQty = (id, delta) => { 
                setCart(prev => prev.map(item => { 
                    if (item.id === id) { const newQty = item.qty + delta; return newQty > 0 ? { ...item, qty: newQty } : null; } 
                    return item; 
                }).filter(Boolean)); 
            };

            const updateQtyManual = (id, value) => { 
                const newQty = parseInt(value); 
                if(newQty > 0) { setCart(prev => prev.map(item => item.id === id ? { ...item, qty: newQty } : item)); }
            };

            const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            const filteredProducts = products.filter(p => p.name.toLowerCase().includes(search.toLowerCase()));
            
            const handlePrint = () => { window.print(); };
            
            const safeTransactions = Array.isArray(transactions) ? transactions : [];
            const userHistory = safeTransactions.filter(t => t.employeeName === user.name).sort((a,b) => b.id - a.id);
            const groupedHistory = userHistory.reduce((acc, tx) => { 
                try {
                    const day = tx.date.split(',')[0]; 
                    if(!acc[day]) acc[day] = []; 
                    acc[day].push(tx); 
                    return acc;
                } catch(e) { return acc; }
            }, {});

            return (
                <div className="h-screen flex flex-col md:flex-row overflow-hidden relative">
                    {showHistory && (
                        <div className="absolute inset-0 z-50 bg-black/50 flex items-center justify-center p-4 fade-in">
                            <div className="bg-white w-full max-w-2xl h-[80vh] rounded-xl shadow-2xl flex flex-col overflow-hidden">
                                <div className="p-4 border-b flex justify-between items-center bg-ice-50">
                                    <h2 className="text-xl font-bold text-ice-800">My Sales History</h2>
                                    <button onClick={() => setShowHistory(false)} className="p-2 bg-white rounded-full shadow hover:bg-gray-100 text-gray-600"><i data-lucide="x"></i></button>
                                </div>
                                <div className="flex-1 overflow-y-auto p-4">
                                    {Object.keys(groupedHistory).length === 0 && <p className="text-center text-gray-500 mt-10">No sales history found.</p>}
                                    {Object.keys(groupedHistory).sort().reverse().map(date => (
                                        <div key={date} className="mb-6">
                                            <h3 className="text-sm font-bold text-gray-500 bg-gray-100 inline-block px-3 py-1 rounded-full mb-2">{date}</h3>
                                            <div className="space-y-2">
                                                {groupedHistory[date].map(tx => (
                                                    <div key={tx.id} className="bg-white border rounded-lg p-3 shadow-sm">
                                                        <div className="flex justify-between items-center mb-2 cursor-pointer" onClick={() => setExpandedId(expandedId === tx.id ? null : tx.id)}>
                                                            <span className="font-bold text-gray-700">₹{tx.total}</span>
                                                            <span className="text-sm font-mono text-ice-600 bg-ice-50 px-2 py-1 rounded">{tx.date.split(',')[1].trim()}</span>
                                                        </div>
                                                        {expandedId === tx.id && (
                                                            <ul className="text-sm text-gray-600 border-t pt-2 space-y-1">
                                                                {Array.isArray(tx.items) ? tx.items.map((item,i) => <li key={i}>{item.qty} x {item.name}</li>) : <li>Items data missing</li>}
                                                            </ul>
                                                        )}
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}

                    <div className="flex-1 flex flex-col h-full bg-gray-50">
                        <header className="bg-white shadow-sm p-4 flex justify-between items-center z-10">
                            <div>
                                <h2 className="text-xl font-bold text-gray-800">POS Terminal</h2>
                                <p className="text-sm text-gray-500">Operator: <span className="text-ice-600 font-semibold">{user.name}</span></p>
                            </div>
                            <div className="flex gap-2">
                                <button onClick={() => setShowHistory(true)} className="p-2 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded transition"><i data-lucide="history"></i></button>
                                <button onClick={onLogout} className="p-2 text-gray-500 hover:text-red-500 transition"><i data-lucide="log-out"></i></button>
                            </div>
                        </header>
                        <div className="p-4 flex-1 overflow-y-auto">
                            <div className="mb-4 relative">
                                <i data-lucide="search" className="absolute left-3 top-3 text-gray-400"></i>
                                <input type="text" placeholder="Search items..." className="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg outline-none focus:border-ice-500" value={search} onChange={(e) => setSearch(e.target.value)} />
                            </div>
                            <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                                {filteredProducts.map(p => (
                                    <button key={p.id} onClick={() => addToCart(p)} className="bg-white p-4 rounded-xl shadow-sm hover:shadow-md border border-transparent hover:border-ice-200 transition flex flex-col items-center justify-center gap-2 group">
                                        {p.image ? (
                                            <img src={p.image} alt={p.name} className="w-16 h-16 object-cover rounded-full mb-2" onError={(e) => e.target.style.display='none'} />
                                        ) : (
                                            <div className={`w-16 h-16 rounded-full flex items-center justify-center text-3xl mb-2 ${p.category === 'Icecream' ? 'bg-pink-100' : p.category === 'Cone' ? 'bg-yellow-100' : 'bg-purple-100'}`}>🍦</div>
                                        )}
                                        <div className="text-center">
                                            <h3 className="font-semibold text-gray-700 text-sm truncate w-full">{p.name}</h3>
                                            <p className="text-ice-600 font-bold">₹{p.price}</p>
                                        </div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                    
                    <div className="w-full md:w-96 bg-white shadow-xl flex flex-col h-[40vh] md:h-full z-20">
                        <div className="p-4 border-b bg-gray-50 flex justify-between items-center">
                            <h3 className="font-bold text-gray-700">Current Order</h3>
                            <span className="bg-ice-100 text-ice-700 text-xs px-2 py-1 rounded-full">{cart.length} items</span>
                        </div>
                        <div className="flex-1 overflow-y-auto p-4 space-y-3">
                            {cart.length === 0 ? (
                                <div className="h-full flex flex-col items-center justify-center text-gray-400">
                                    <i data-lucide="shopping-cart" className="mb-2 opacity-50"></i>
                                    <p>Cart is empty</p>
                                </div>
                            ) : (
                                cart.map(item => (
                                    <div key={item.id} className="flex justify-between items-center bg-white border rounded-lg p-3 shadow-sm">
                                        <div className="flex-1">
                                            <p className="font-medium text-gray-800 text-sm">{item.name}</p>
                                            <p className="text-xs text-gray-500">₹{item.price} x {item.qty}</p>
                                        </div>
                                        <div className="flex items-center gap-2 bg-gray-50 rounded-lg p-1">
                                            <button onClick={() => updateQty(item.id, -1)} className="w-6 h-6 rounded bg-white hover:bg-gray-200 flex items-center justify-center text-gray-600 font-bold">-</button>
                                            <input 
                                                type="number" 
                                                value={item.qty} 
                                                onChange={(e) => updateQtyManual(item.id, e.target.value)} 
                                                className="w-10 text-center text-sm bg-transparent outline-none font-bold text-gray-700" 
                                                min="1"
                                            />
                                            <button onClick={() => updateQty(item.id, 1)} className="w-6 h-6 rounded bg-white hover:bg-gray-200 flex items-center justify-center text-gray-600 font-bold">+</button>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                        <div className="p-4 bg-gray-50 border-t space-y-3">
                            <div className="flex justify-between items-center">
                                <span className="text-gray-600 font-medium">Total Amount</span>
                                <span className="text-2xl font-bold text-gray-800">₹{totalAmount}</span>
                            </div>
                            <div className="grid grid-cols-2 gap-3">
                                <button onClick={handlePrint} disabled={cart.length === 0} className="w-full bg-white border border-gray-300 text-gray-700 hover:bg-gray-100 font-bold py-3 rounded-lg shadow transition flex justify-center items-center gap-2">
                                    <i data-lucide="printer"></i> Print
                                </button>
                                <button onClick={() => onCheckout(cart, totalAmount)} disabled={cart.length === 0} className="w-full bg-ice-600 hover:bg-ice-700 disabled:bg-gray-300 text-white font-bold py-3 rounded-lg shadow transition flex justify-center items-center gap-2">
                                    <i data-lucide="save"></i> Save
                                </button>
                            </div>
                        </div>
                    </div>

                    <div id="print-area" className="hidden">
                        <div style={{textAlign: 'center', marginBottom: '20px'}}><h1 style={{fontSize: '24px', fontWeight: 'bold', margin: 0}}>MURLIDHAR ICECREAM</h1><p style={{color: '#666', fontSize: '12px'}}>Delicious & Fresh</p></div>
                        <div style={{borderBottom: '1px dashed #ccc', marginBottom: '10px', paddingBottom: '10px'}}><p><strong>Date:</strong> {new Date().toLocaleDateString()}</p><p><strong>Operator:</strong> {user.name}</p></div>
                        <table style={{width: '100%', borderCollapse: 'collapse', marginBottom: '20px', fontSize: '14px'}}><thead><tr style={{borderBottom: '2px solid #000'}}><th style={{textAlign: 'left'}}>Item</th><th style={{textAlign: 'center'}}>Qty</th><th style={{textAlign: 'right'}}>Price</th><th style={{textAlign: 'right'}}>Total</th></tr></thead><tbody>{cart.map((item, idx) => (<tr key={idx}><td style={{padding: '5px 0'}}>{item.name}</td><td style={{textAlign: 'center'}}>{item.qty}</td><td style={{textAlign: 'right'}}>₹{item.price}</td><td style={{textAlign: 'right'}}>₹{item.price * item.qty}</td></tr>))}</tbody></table>
                        <div style={{textAlign: 'right', fontSize: '18px', fontWeight: 'bold', borderTop: '2px solid #000', paddingTop: '10px'}}>TOTAL: ₹{totalAmount}</div>
                        <div style={{textAlign: 'center', marginTop: '30px', fontSize: '12px'}}><p>Thank you for your visit!</p><p>Visit us again.</p></div>
                    </div>
                </div>
            );
        };

        // 3. OVERVIEW TAB
        const OverviewTab = ({ transactions, users, returns, products, expenses }) => {
            useIcons();
            const chart1 = useRef(null); 
            const colorPalette = ['#ec4899', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];

            const todayStr = new Date().toLocaleDateString();
            
            const analytics = users.filter(u => u.role !== 'admin').map(u => {
                const totalSales = transactions.filter(t => t.employeeName === u.name).reduce((s,t) => s+t.total, 0);
                const userReturns = returns.filter(r => r.userName === u.name && r.date === todayStr);
                const totalReturnVal = userReturns.reduce((s,r) => {
                    let val = 0;
                    if (r.isBulk) { val = r.amount; } 
                    else { const product = products.find(p => p.id === r.itemId); val = (product ? product.price : 0) * r.qty; }
                    const bearer = r.costBearer || '100_owner';
                    if(bearer === '100_owner') return s;
                    if(bearer === '50_50') return s + (val * 0.5);
                    return s + val;
                }, 0);
                const netSales = totalSales - totalReturnVal;
                const commPercent = (u.commission !== undefined && !isNaN(u.commission)) ? u.commission : 0;
                const commission = netSales * (commPercent / 100);
                return { name: u.name, totalSales, totalReturnVal, netSales, commission };
            });

            const totalComm = analytics.reduce((sum, u) => sum + u.commission, 0);

            const totalIncome = transactions.reduce((sum, t) => sum + t.total, 0);
            
            const totalOwnerExpenses = expenses.reduce((sum, e) => sum + e.amount, 0);
            const netProfit = totalIncome - (totalOwnerExpenses + totalComm);

            useEffect(() => { 
                try {
                    if(window.c1) { window.c1.destroy(); window.c1 = null; }
                    if(chart1.current && analytics.length > 0) {
                        window.c1 = new Chart(chart1.current, { 
                            type: 'bar', 
                            data: { 
                                labels: analytics.map(e => e.name), 
                                datasets: [{ 
                                    label: 'Net Sales (Today ₹)', 
                                    data: analytics.map(e => e.netSales), 
                                    backgroundColor: analytics.map((_, i) => colorPalette[i % colorPalette.length]), 
                                    borderRadius: 4 
                                }] 
                            }, 
                            options: { responsive: true, maintainAspectRatio: false } 
                        }); 
                    }
                } catch (e) { console.error("Chart Error suppressed:", e); }
            }, [todayStr, returns, transactions]);

            return (
                <div className="space-y-6 fade-in">
                    <h2 className="text-2xl font-bold text-gray-800">User Board (Dashboard)</h2>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-green-500">
                            <p className="text-gray-500 text-sm">Total Income</p>
                            <h3 className="text-3xl font-bold text-gray-800">₹{totalIncome}</h3>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border-l-4 border-red-500">
                            <p className="text-gray-500 text-sm">Owner Expenses (Inc. Returns)</p>
                            <h3 className="text-3xl font-bold text-gray-800">₹{(totalOwnerExpenses + totalComm).toFixed(2)}</h3>
                        </div>
                        <div className={`bg-white p-6 rounded-xl shadow-sm border-l-4 ${netProfit >= 0 ? 'border-blue-500' : 'border-red-600'}`}>
                            <p className="text-gray-500 text-sm">Net Profit</p>
                            <h3 className={`text-3xl font-bold ${netProfit >= 0 ? 'text-blue-600' : 'text-red-600'}`}>₹{netProfit.toFixed(2)}</h3>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm h-96 overflow-y-auto">
                            <div className="flex justify-between items-center mb-4 sticky top-0 bg-white pb-2 border-b">
                                <h3 className="font-bold text-gray-700">Employee Performance (Today)</h3>
                                <span className="text-xs text-gray-400">Live</span>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead>
                                        <tr className="border-b bg-gray-50 text-gray-500">
                                            <th className="pb-2 pl-2">Employee</th>
                                            <th className="pb-2 text-right pr-2 text-green-600">Sales</th>

            let viewTransactions = transactions;
            
            if (selectedDate) viewTransactions = viewTransactions.filter(t => t.date.startsWith(selectedDate));
            else if (selectedUser !== 'All') viewTransactions = viewTransactions.filter(tx => tx.employeeName === selectedUser);

            if(searchTerm) {
                const term = searchTerm.toLowerCase();
                viewTransactions = viewTransactions.filter(tx => 
                    tx.employeeName.toLowerCase().includes(term) || 
                    tx.total.toString().includes(term)
                );
            }

            const getDailyAnalytics = (dateStr) => {
                const dayTx = transactions.filter(t => t.date.startsWith(dateStr));
                const dayReturns = returns.filter(r => r.date === dateStr);
                return visibleUsers.map(u => {
                    const totalSales = dayTx.filter(t => t.employeeName === u.name).reduce((s,t) => s+t.total, 0);
                    const userReturns = dayReturns.filter(r => r.userName === u.name);
                    const totalReturnVal = userReturns.reduce((s,r) => {
                        let val = 0;
                        if (r.isBulk) { val = r.amount; } 
                        else { const product = products.find(p => p.id === r.itemId); val = (product ? product.price : 0) * r.qty; }
                        const bearer = r.costBearer || '100_owner';
                        if(bearer === '100_owner') return s;
                        if(bearer === '50_50') return s + (val * 0.5);
                        return s + val;

                    return { name: u.name, totalSales, totalReturnVal, netSales: totalSales - totalReturnVal };

                    </div>

                    <div className="bg-white rounded-xl shadow-sm overflow-hidden min-h-[300px]">

                                                        {expandedId === tx.id ? 'Hide' : 'View'}

                                                                {tx.items.map((item,i) => <li key={i} className="flex justify-between text-sm border-b pb-1"><span>{item.qty} x {item.name}</span><span>₹{item.price * item.qty}</span></li>)}

        // 6. RETURNS TAB
        const ReturnsTab = ({ returns, products, users, addReturn, updateReturn, deleteReturn, addExpense, deleteExpense, updateExpense, expenses }) => {
            useIcons();
            const [mode, setMode] = useState('item'); 
            const [userId, setUserId] = useState(''); 
            const [itemId, setItemId] = useState(''); 
            const [qty, setQty] = useState(1);
            const [bulkAmount, setBulkAmount] = useState('');
            const [reason, setReason] = useState('Damage');
            const [costBearer, setCostBearer] = useState('100_owner'); 

            const handleAdd = (e) => {
                e.preventDefault();
                if(!userId) return;
                const user = users.find(u => u.id == userId);
                let val = 0;
                let returnObj = {};

                if (mode === 'bulk') {
                    val = parseFloat(bulkAmount);
                    if(!val || val <= 0) return alert("Invalid bulk amount");
                    returnObj = { id: Date.now(), date: new Date().toLocaleDateString(), userName: user.name, amount: val, reason: reason, isBulk: true, costBearer: costBearer };
                } else {
                    const product = products.find(p => p.id == itemId);
                    if(!product) return alert("Select an item");
                    val = product.price * parseInt(qty);
                    returnObj = { id: Date.now(), date: new Date().toLocaleDateString(), userName: user.name, itemId: product.id, itemName: product.name, qty: parseInt(qty), reason: reason, isBulk: false, costBearer: costBearer };
                }
                addReturn(returnObj);

                let ownerExpenseShare = 0;
                if(costBearer === '100_owner') ownerExpenseShare = val;
                else if(costBearer === '50_50') ownerExpenseShare = val * 0.5;
                
                if (ownerExpenseShare > 0) {
                    addExpense({ id: Date.now() + 1, desc: `Return Share - ${user.name} (${costBearer})`, amount: ownerExpenseShare, date: new Date().toLocaleDateString(), isReturnLoss: true, linkedReturnId: returnObj.id });
                }
                setItemId(''); setQty(1); setBulkAmount(''); setReason('Damage'); setCostBearer('100_owner');
            };

            const handleEditReturn = (id) => {
                const item = returns.find(r => r.id === id);
                if(!item) return;
                
                const newReason = prompt("Update Reason:", item.reason);
                if (newReason === null) return;
                
                const bearerMap = { '1': '100_owner', '2': '50_50', '3': '100_emp' };
                const bearerChoice = prompt("Update Cost Bearer:\n1. 100% Owner\n2. 50/50\n3. 100% Employee", item.costBearer === '100_owner' ? '1' : item.costBearer === '50_50' ? '2' : '3');
                
                if (bearerChoice && ['1','2','3'].includes(bearerChoice)) {
                    const updatedReturn = { ...item, reason: newReason, costBearer: bearerMap[bearerChoice] };
                    updateReturn(id, updatedReturn);
                    
                    const linkedExpense = expenses.find(e => e.linkedReturnId === id);
                    let val = 0;
                    if (item.isBulk) { val = item.amount; }
                    else { const product = products.find(p => p.id === item.itemId); val = (product ? product.price : 0) * item.qty; }
                    
                    let newOwnerShare = 0;
                    if(updatedReturn.costBearer === '100_owner') newOwnerShare = val;
                    else if(updatedReturn.costBearer === '50_50') newOwnerShare = val * 0.5;

                    if(linkedExpense) {
                        if(newOwnerShare > 0) updateExpense(linkedExpense.id, linkedExpense.desc, newOwnerShare);
                        else deleteExpense(linkedExpense.id);
                    } else if (newOwnerShare > 0) {
                        addExpense({ id: Date.now(), desc: `Return Share - ${item.userName} (${updatedReturn.costBearer})`, amount: newOwnerShare, date: item.date, isReturnLoss: true, linkedReturnId: item.id });
                    }
                    alert("Return Updated successfully!");
                }
            };

            return (

                                <button type="button" onClick={()=>setMode('bulk')} className={`px-3 py-1 rounded text-sm ${mode==='bulk'?'bg-white shadow text-ice-600':'text-gray-500'}`}>Bulk Return</button>
                            </div>

                        <form onSubmit={handleAdd} className="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                            <select className="p-2 border rounded" value={userId} onChange={e=>setUserId(e.target.value)}>
                                <option value="">Select Employee</option>
                                {users.filter(u => u.role !== 'admin').map(u => <option key={u.id} value={u.id}>{u.name}</option>)}
                            </select>
                            {mode === 'item' ? (
                                <>
                                    <select className="p-2 border rounded" value={itemId} onChange={e=>setItemId(e.target.value)}>
                                        <option value="">Select Item</option>
                                        {products.map(p => <option key={p.id} value={p.id}>{p.name} (₹{p.price})</option>)}
                                    </select>
                                    <input type="number" min="1" placeholder="Qty" className="p-2 border rounded" value={qty} onChange={e=>setQty(e.target.value)} />
                                </>
                            ) : (
                                <input type="number" placeholder="Amount (₹)" className="md:col-span-2 p-2 border rounded" value={bulkAmount} onChange={e=>setBulkAmount(e.target.value)} />
                            )}
                            <select className="p-2 border rounded bg-orange-50 text-orange-800" value={costBearer} onChange={e=>setCostBearer(e.target.value)}>
                                <option value="100_owner">Cost: 100% Owner</option>
                                <option value="50_50">Cost: 50% / 50%</option>
                                <option value="100_emp">Cost: 100% Employee</option>
                            </select>
                            <select className="p-2 border rounded" value={reason} onChange={e=>setReason(e.target.value)}>
                                <option value="Damage">Damage</option>
                                <option value="Returned">Returned</option>
                                <option value="Other">Other</option>
                            </select>
                            <button type="submit" className="bg-red-600 text-white font-bold py-2 rounded hover:bg-red-700 flex justify-center items-center gap-2">
                                <i data-lucide="minus-circle"></i> Log Return
                            </button>
                        </form>
                    </div>

                    <div className="bg-white rounded-xl shadow-sm overflow-hidden">
                        <table className="w-full text-left">
                            <thead className="bg-gray-50"><tr><th className="p-4">Date</th><th className="p-4">Employee</th><th className="p-4">Details</th><th className="p-4">Cost Bearer</th><th className="p-4">Reason</th><th className="p-4 text-right">Actions</th></tr></thead>
                            <tbody>
                                {returns.map(r => (
                                    <tr key={r.id} className="border-t">
                                        <td className="p-4 text-gray-500">{r.date}</td>
                                        <td className="p-4 font-medium">{r.userName}</td>
                                        <td className="p-4">
                                            {r.isBulk ? <span className="font-bold text-red-600">Bulk: ₹{r.amount}</span> : <span>{r.itemName} x {r.qty}</span>}
                                        </td>
                                        <td className="p-4">
                                            <span className={`text-xs px-2 py-1 rounded-full font-bold ${
                                                r.costBearer === '100_emp' ? 'bg-red-100 text-red-700' : 
                                                r.costBearer === '50_50' ? 'bg-yellow-100 text-yellow-700' : 'bg-green-100 text-green-700'
                                            }`}>
                                                {r.costBearer === '100_emp' ? '100% Emp' : r.costBearer === '50_50' ? '50/50' : '100% Owner'}
                                            </span>
                                        </td>
                                        <td className="p-4"><span className="bg-gray-100 text-gray-700 text-xs px-2 py-1 rounded-full">{r.reason}</span></td>
                                        <td className="p-4 text-right flex justify-end gap-2">
                                            <button onClick={() => handleEditReturn(r.id)} className="text-blue-500 hover:text-blue-700 p-1" title="Edit Return"><i data-lucide="edit-2" width="16"></i></button>
                                            <button onClick={() => deleteReturn(r.id)} className="text-red-500 hover:text-red-700 p-1" title="Delete Return"><i data-lucide="trash-2" width="16"></i></button>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

            const visibleUsers = users.filter(u => u.role !== 'admin');
            return (<div className="space-y-6 fade-in"><div className="bg-white p-6 rounded-xl shadow-sm"><h3 className="font-bold text-gray-700 mb-4">Add New Employee</h3><form onSubmit={handleAdd} className="flex flex-wrap gap-4 items-end"><input placeholder="Employee Name" className="flex-1 min-w-[150px] p-2 border rounded" value={name} onChange={e=>setName(e.target.value)} /><input type="number" placeholder="PIN" maxLength="4" className="w-24 p-2 border rounded" value={pin} onChange={e=>setPin(e.target.value.slice(0,4))} /><select className="p-2 border rounded" value={role} onChange={e=>setRole(e.target.value)}><option value="staff">Staff</option><option value="admin">Admin</option></select><input type="number" placeholder="Comm %" className="w-20 p-2 border rounded" value={comm} onChange={e=>setComm(e.target.value)} /><button type="submit" className="bg-ice-600 text-white px-4 py-2 rounded hover:bg-ice-700"><i data-lucide="user-plus"></i> Add</button></form></div><div className="bg-white rounded-xl shadow-sm overflow-hidden"><table className="w-full text-left"><thead className="bg-gray-50"><tr><th className="p-4">Name</th><th className="p-4">Role</th><th className="p-4">Comm %</th><th className="p-4 text-center">Status</th><th className="p-4 text-right">Actions</th></tr></thead><tbody>{visibleUsers.map(u => (<tr key={u.id} className="border-t"><td className="p-4 font-medium">{u.name} {u.id === currentUser.id && <span className="text-xs text-gray-400">(You)</span>}</td><td className="p-4"><span className="px-2 py-1 rounded text-xs bg-blue-100 text-blue-700">Staff</span></td><td className="p-4 font-bold text-green-600">{u.commission || 0}%</td><td className="p-4 text-center">{u.locked ? <span className="bg-red-100 text-red-700 text-xs px-2 py-1 rounded-full font-bold">Locked</span> : <span className="bg-green-100 text-green-700 text-xs px-2 py-1 rounded-full font-bold">Active</span>}</td><td className="p-4 text-right flex justify-end gap-2"><button onClick={() => toggleLock(u.id)} className={`p-1 ${u.locked ? 'text-green-600 hover:bg-green-50' : 'text-orange-600 hover:bg-orange-50'}`} title={u.locked ? "Unlock Account" : "Lock Account"}><i data-lucide={u.locked ? "unlock" : "lock"} width="18"></i></button><button onClick={() => updatePin(u.id)} className="text-orange-500 hover:text-orange-700 p-1" title="Reset PIN"><i data-lucide="key" width="16"></i></button><button onClick={() => updateCommission(u.id)} className="text-green-500 hover:text-green-700 p-1" title="Set Commission"><i data-lucide="percent" width="16"></i></button><button onClick={() => deleteUser(u.id)} className="text-red-500 hover:text-red-700 p-1"><i data-lucide="trash-2" width="16"></i></button></td></tr>))}</tbody></table></div></div>);
        };

        // 8. EXPENSES TAB
        const ExpensesTab = ({ expenses, addExpense, deleteExpense, editExpense }) => {
            useIcons();
            const [desc, setDesc] = useState(''); const [amt, setAmt] = useState('');
            const handleAdd = (e) => { e.preventDefault(); if(!desc || !amt) return; addExpense({ id: Date.now(), desc, amount: Number(amt), date: new Date().toLocaleDateString() }); setDesc(''); setAmt(''); };
            
            const handleEdit = (id) => { 
                const item = expenses.find(e => e.id === id); 
                if(!item) return; 
                if(item.isReturnLoss) return alert("This is an automated expense from a Return. Please edit the Return record to change this.");
                const newDesc = prompt("Edit Description:", item.desc); if (newDesc === null) return; 
                const newAmt = prompt("Edit Amount:", item.amount); if (newAmt === null) return; 
                if(newDesc.trim() !== "" && newAmt.trim() !== "" && !isNaN(newAmt)) { editExpense(id, newDesc.trim(), Number(newAmt)); }
            }; 
            return (<div className="space-y-6 fade-in"><div className="bg-white p-6 rounded-xl shadow-sm"><h3 className="font-bold text-gray-700 mb-4">Add Daily Expense</h3><form onSubmit={handleAdd} className="flex gap-4 items-end"><input placeholder="Description (e.g. Milk)" className="flex-1 p-2 border rounded" value={desc} onChange={e=>setDesc(e.target.value)} /><input type="number" placeholder="Amount" className="w-32 p-2 border rounded" value={amt} onChange={e=>setAmt(e.target.value)} /><button type="submit" className="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600"><i data-lucide="minus"></i> Add Expense</button></form></div><div className="bg-white rounded-xl shadow-sm overflow-hidden"><table className="w-full text-left"><thead className="bg-gray-50"><tr><th className="p-4">Date</th><th className="p-4">Description</th><th className="p-4">Amount</th><th className="p-4 text-right">Actions</th></tr></thead><tbody>{expenses.map(e => (<tr key={e.id} className="border-t"><td className="p-4 text-gray-500">{e.date}</td><td className="p-4"><div>{e.desc}</div>{e.isReturnLoss && <span className="text-xs text-orange-500 bg-orange-100 px-1 rounded">Linked to Return</span>}</td><td className="p-4 text-red-500 font-bold">-₹{e.amount}</td><td className="p-4 text-right flex justify-end gap-2">{!e.isReturnLoss && <button onClick={() => handleEdit(e.id)} className="text-blue-500 hover:text-blue-700 p-1"><i data-lucide="edit-2" width="16"></i></button>}{!e.isReturnLoss && <button onClick={() => deleteExpense(e.id)} className="text-red-500 hover:text-red-700 p-1"><i data-lucide="trash-2" width="16"></i></button>}</td></tr>))}</tbody></table></div></div>); 
        };

        // 9. MENU TAB
        const MenuTab = ({ products, addProduct, deleteProduct }) => {
            useIcons();
            const [newItem, setNewItem] = useState({ name: '', price: '', image: '' });
            const handleAdd = (e) => {
                e.preventDefault();
                if(!newItem.name || !newItem.price) return;
                addProduct({ ...newItem, id: Date.now(), price: Number(newItem.price), category: 'General' });
                setNewItem({ name: '', price: '', image: '' });
            };
            return (
                <div className="space-y-6 fade-in">
                    <div className="bg-white p-6 rounded-xl shadow-sm">
                        <h3 className="font-bold text-gray-700 mb-4">Add New Item</h3>
                        <form onSubmit={handleAdd} className="flex flex-col md:flex-row gap-4 items-end">
                            <input placeholder="Item Name" className="flex-1 min-w-[150px] p-2 border rounded" value={newItem.name} onChange={e=>setNewItem({...newItem, name: e.target.value})} />
                            <input type="number" placeholder="Price" className="w-24 p-2 border rounded" value={newItem.price} onChange={e=>setNewItem({...newItem, price: e.target.value})} />
                            <input placeholder="Image URL" className="flex-1 md:w-48 p-2 border rounded text-sm" value={newItem.image} onChange={e=>setNewItem({...newItem, image: e.target.value})} />
                            <button type="submit" className="bg-ice-600 text-white px-4 py-2 rounded hover:bg-ice-700"><i data-lucide="plus"></i> Add</button>
                        </form>
                    </div>
                    <div className="bg-white rounded-xl shadow-sm overflow-hidden">
                        <table className="w-full text-left">
                            <thead className="bg-gray-50">
                                <tr>
                                    <th className="p-4">Image</th>
                                    <th className="p-4">Name</th>
                                    <th className="p-4">Price</th>
                                    <th className="p-4">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                {products.map(p => (
                                    <tr key={p.id} className="border-t hover:bg-gray-50">
                                        <td className="p-4">{p.image ? <img src={p.image} className="w-8 h-8 object-cover rounded" onError={(e)=>e.target.style.display='none'}/> : <span className="text-gray-300 text-xs">No Img</span>}</td>
                                        <td className="p-4 font-medium">{p.name}</td>
                                        <td className="p-4">₹{p.price}</td>
                                        <td className="p-4"><button onClick={()=>deleteProduct(p.id)} className="text-red-500 hover:text-red-700"><i data-lucide="trash-2"></i></button></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // 10. ADMIN DASHBOARD
        const AdminDashboard = ({ user, products, transactions, expenses, users, returns, onLogout, onAddProduct, onDeleteProduct, onAddExpense, onDeleteExpense, onEditExpense, onAddUser, onDeleteUser, onUpdatePin, onUpdateCommission, onAddReturn, onUpdateReturn, onDeleteReturn, onToggleLock }) => {
            useIcons();
            const [activeTab, setActiveTab] = useState('overview');
            return (
                <div className="min-h-screen bg-gray-50 flex">
                    <div className="w-64 bg-white shadow-xl hidden md:block flex flex-col">
                        <div className="p-6 border-b"><h1 className="text-xl font-bold text-ice-600">Admin Panel</h1><p className="text-xs text-gray-400">Owner Mode</p></div>
                        <nav className="p-4 space-y-2 flex-1 overflow-y-auto">
                            {['overview', 'popular', 'history', 'returns', 'expenses', 'employees', 'menu'].map(tab => (<button key={tab} onClick={() => setActiveTab(tab)} className={`w-full text-left p-3 rounded-lg flex items-center gap-3 capitalize ${activeTab === tab ? 'bg-ice-100 text-ice-700 font-bold' : 'text-gray-600 hover:bg-gray-100'}`}><i data-lucide={tab === 'overview' ? 'layout-dashboard' : tab === 'popular' ? 'trending-up' : tab === 'history' ? 'list' : tab === 'returns' ? 'rotate-ccw' : tab === 'expenses' ? 'receipt' : tab === 'employees' ? 'users' : 'utensils'}></i>{tab === 'popular' ? 'Popular Items' : tab}</button>))}
                        </nav>
                        <div className="p-4 border-t space-y-2"><button onClick={() => onUpdatePin(user.id)} className="w-full text-left px-4 py-2 text-sm text-orange-600 hover:text-orange-800 hover:bg-orange-50 rounded flex items-center gap-2"><i data-lucide="lock" className="w-4 h-4"></i> Change My PIN</button><button onClick={onLogout} className="w-full text-left px-4 py-2 text-sm text-gray-500 hover:text-red-500 hover:bg-red-50 rounded flex items-center gap-2"><i data-lucide="log-out" className="w-4 h-4"></i> Logout</button></div>
                    </div>
                    <div className="flex-1 p-8 overflow-y-auto h-screen">
                        <div className="md:hidden flex justify-between items-center mb-6 bg-white p-4 shadow rounded"><span className="font-bold text-ice-600">Admin</span><button onClick={onLogout} className="text-sm text-red-500">Logout</button></div>
                        <div className="md:hidden flex gap-2 mb-6 overflow-x-auto pb-2">{['overview', 'popular', 'history', 'returns', 'expenses', 'employees', 'menu'].map(tab => <button key={tab} onClick={() => setActiveTab(tab)} className={`px-4 py-2 rounded-full text-sm whitespace-nowrap ${activeTab === tab ? 'bg-ice-600 text-white' : 'bg-white text-gray-600'}`}>{tab === 'popular' ? 'Popular' : tab === 'history' ? 'History' : tab.toUpperCase()}</button>)}</div>
                        {activeTab === 'overview' && <OverviewTab transactions={transactions} users={users} returns={returns} products={products} expenses={expenses} />}
                        {activeTab === 'popular' && <PopularItemsTab transactions={transactions} />}
                        {activeTab === 'history' && <SalesHistoryTab transactions={transactions} users={users} returns={returns} products={products} />}
                        {activeTab === 'returns' && <ReturnsTab returns={returns} products={products} users={users} addReturn={onAddReturn} updateReturn={onUpdateReturn} deleteReturn={onDeleteReturn} addExpense={onAddExpense} deleteExpense={onDeleteExpense} updateExpense={onEditExpense} expenses={expenses} />}
                        {activeTab === 'expenses' && <ExpensesTab expenses={expenses} addExpense={onAddExpense} deleteExpense={onDeleteExpense} editExpense={onEditExpense} />}
                        {activeTab === 'employees' && <EmployeesTab users={users} addUser={onAddUser} deleteUser={onDeleteUser} currentUser={user} updatePin={onUpdatePin} updateCommission={onUpdateCommission} toggleLock={onToggleLock} />}
                        {activeTab === 'menu' && <MenuTab products={products} addProduct={onAddProduct} deleteProduct={onDeleteProduct} />}
                    </div>
                </div>
            );
        };

        // 11. MAIN APP (Updated for Firebase)
        const App = () => {
            const [currentUser, setCurrentUser] = useState(null);
            const [toast, setToast] = useState(null);
            const [loading, setLoading] = useState(true);

            // Live Data Containers
            const [users, setUsers] = useState([]);
            const [products, setProducts] = useState([]);
            const [transactions, setTransactions] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [returns, setReturns] = useState([]);

            // 1. Initial Load & Listeners
            useEffect(() => {
                const unsubUsers = db.collection('users').onSnapshot(snap => setUsers(snap.docs.map(d => ({...d.data(), docId: d.id}))));
                const unsubProds = db.collection('products').onSnapshot(snap => setProducts(snap.docs.map(d => ({...d.data(), docId: d.id}))));
                const unsubSales = db.collection('sales').onSnapshot(snap => setTransactions(snap.docs.map(d => ({...d.data(), docId: d.id}))));
                const unsubExp = db.collection('expenses').onSnapshot(snap => setExpenses(snap.docs.map(d => ({...d.data(), docId: d.id}))));
                const unsubRet = db.collection('returns').onSnapshot(snap => setReturns(snap.docs.map(d => ({...d.data(), docId: d.id}))));

                setLoading(false);
                return () => { unsubUsers(); unsubProds(); unsubSales(); unsubExp(); unsubRet(); };
            }, []);

            // 2. Seed Data if Empty (First Run)
            useEffect(() => {
                if(!loading && users.length === 0) {
                    DEFAULT_USERS_SEED.forEach(u => db.collection('users').add(u));
                    DEFAULT_PRODUCTS_SEED.forEach(p => db.collection('products').add(p));
                    console.log("Database seeded with defaults.");
                }
            }, [loading, users]);

            // 3. Database Actions
            const handleCheckout = (cartItems, total) => { 
                const newTx = { id: Date.now(), date: new Date().toLocaleString(), employeeName: currentUser.name, items: cartItems, total: total }; 
                db.collection('sales').add(newTx);
                setToast({ message: "Order Saved (Synced)", type: 'success' }); 
            };
            
            // Note: We use existing 'id' for logical search, but 'docId' for Firestore operations
            const handleAddProduct = (product) => { db.collection('products').add(product); setToast({ message: "Item added", type: 'success' }); };
            const handleDeleteProduct = (id) => { const item = products.find(p => p.id === id); if(item) db.collection('products').doc(item.docId).delete(); };
            
            const handleAddExpense = (expense) => { db.collection('expenses').add(expense); setToast({ message: "Expense recorded", type: 'success' }); };
            const handleDeleteExpense = (id) => { const item = expenses.find(e => e.id === id); if(item) db.collection('expenses').doc(item.docId).delete(); setToast({ message: "Expense deleted", type: 'success' }); };
            const handleEditExpense = (id, newDesc, newAmt) => { const item = expenses.find(e => e.id === id); if(item) db.collection('expenses').doc(item.docId).update({ desc: newDesc, amount: newAmt }); setToast({ message: "Expense updated", type: 'success' }); };
            
            const handleAddUser = (newUser) => { db.collection('users').add(newUser); setToast({ message: "Employee added", type: 'success' }); };
            const handleDeleteUser = (id) => { 
                const userToDelete = users.find(u => u.id === id); 
                const otherAdmins = users.filter(u => u.role === 'admin' && u.id !== id); 
                if(userToDelete.role === 'admin' && otherAdmins.length === 0) { setToast({ message: "Cannot delete the last Admin!", type: 'error' }); return; } 
                db.collection('users').doc(userToDelete.docId).delete();
            };
            
            const handleUpdatePin = (id) => { const newPin = prompt("Enter new 4-digit PIN:"); if(newPin && newPin.length === 4 && !isNaN(newPin)) { const u = users.find(x=>x.id===id); if(u) db.collection('users').doc(u.docId).update({pin: newPin}); setToast({ message: "PIN Updated", type: 'success' }); } };
            const handleUpdateCommission = (id) => { const newComm = prompt("Enter Commission % (e.g., 5):"); if(newComm && !isNaN(newComm)) { const u = users.find(x=>x.id===id); if(u) db.collection('users').doc(u.docId).update({commission: Number(newComm)}); setToast({ message: "Commission Updated", type: 'success' }); } };
            
            const handleToggleLock = (id) => {
                const u = users.find(x=>x.id===id); 
                if(u) {
                    db.collection('users').doc(u.docId).update({locked: !u.locked});
                    setToast({ message: `${u.name} is now ${!u.locked ? 'Locked' : 'Unlocked'}`, type: 'success' });
                }
            };

            const handleAddReturn = (returnObj) => { db.collection('returns').add(returnObj); setToast({ message: "Return Logged", type: 'success' }); };
            const handleUpdateReturn = (id, updatedObj) => { const r = returns.find(x=>x.id===id); if(r) db.collection('returns').doc(r.docId).update(updatedObj); setToast({ message: "Return Updated", type: 'success' }); };
            const handleDeleteReturn = (id) => { 
                const r = returns.find(x=>x.id===id);
                if(r) {
                    db.collection('returns').doc(r.docId).delete();
                    const linkedExpense = expenses.find(e => e.linkedReturnId === id);
                    if(linkedExpense) db.collection('expenses').doc(linkedExpense.docId).delete();
                    setToast({ message: "Return & Linked Expense Deleted", type: 'success' }); 
                }
            };

            if (loading) return <div id="loading-screen"><div className="w-12 h-12 border-4 border-ice-600 border-t-transparent rounded-full animate-spin mb-4"></div><p className="text-gray-500 font-bold">Connecting to Database...</p></div>;

            if (!currentUser) return <Login onLogin={setCurrentUser} users={users} />;
            return (
                <>
                    {toast && <Toast message={toast.message} type={toast.type} onClose={() => setToast(null)} />}
                    {currentUser.role === 'admin' ? (
                        <AdminDashboard 
                            user={currentUser} 
                            products={products} 
                            transactions={transactions} 
                            expenses={expenses}
                            users={users}
                            returns={returns}
                            onLogout={() => setCurrentUser(null)}
                            onAddProduct={handleAddProduct}
                            onDeleteProduct={handleDeleteProduct}
                            onAddExpense={handleAddExpense}
                            onDeleteExpense={handleDeleteExpense}
                            onEditExpense={handleEditExpense}
                            onAddUser={handleAddUser}
                            onDeleteUser={handleDeleteUser}
                            onUpdatePin={handleUpdatePin}
                            onUpdateCommission={handleUpdateCommission}
                            onAddReturn={handleAddReturn}
                            onUpdateReturn={handleUpdateReturn}
                            onDeleteReturn={handleDeleteReturn}
                            onToggleLock={handleToggleLock}
                        />
                    ) : (
                        <POS user={currentUser} users={users} products={products} onLogout={() => setCurrentUser(null)} onCheckout={handleCheckout} transactions={transactions} />
                    )}
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
